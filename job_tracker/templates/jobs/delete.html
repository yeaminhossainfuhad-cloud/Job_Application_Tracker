{% extends 'base.html' %}

{% block title %}Delete Application{% endblock %}

{% block content %}
<h2>Delete Application</h2>
<p>Are you sure you want to delete the application for <strong>{{ job.company_name }}</strong> ({{ job.position }})?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'jobs:job_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
